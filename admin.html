<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%23f1501b'/%3E%3C/svg%3E">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Admin · VDT Mini Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="admin">
<div class="ambient"></div>
<div id="app"><noscript>Admin needs JavaScript.</noscript></div>
<script>
/* never show a blank page: surface any startup error */
window.addEventListener("error", function (e) {
  var d = document.getElementById("app");
  if (d && !d.children.length) d.innerHTML = '<div style="max-width:640px;margin:90px auto;padding:22px;font:15px/1.5 system-ui,sans-serif"><h2 style="font:900 38px Impact,sans-serif">ADMIN FAILED TO START</h2><p>' + String(e.message).replace(/</g, "&lt;") + '</p><p>Try a hard refresh (Ctrl+Shift+R), or disable shields/extensions for this site, then reload.</p></div>';
});
</script>
<script src="assets/js/data.js"></script>
<script src="/api/live"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
