<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Admin sign in · VDT Mini Project</title>
<meta name="theme-color" content="#e7e5df" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131313" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .login-wrap { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; }
  .login-card { width: 100%; max-width: 420px; padding: 34px 30px 28px; display: flex; flex-direction: column; gap: 14px; }
  .login-card h1 { font-family: var(--display); font-weight: 900; text-transform: uppercase; font-size: clamp(40px, 11vw, 56px); line-height: .95; letter-spacing: .01em; }
  .login-card h1 em { font-family: var(--serif); font-weight: 400; text-transform: none; color: var(--accent); }
  .login-card { --soft: color-mix(in srgb, var(--fg) 74%, var(--bg)); } /* --muted is ~4.1:1 on paper; this stays above AA in both themes */
  .login-sub { color: var(--soft); font-size: 15px; line-height: 1.5; }
  .login-card label { font-size: 12.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--soft); margin-top: 6px; }
  .login-card input { width: 100%; padding: 13px 16px; border-radius: 12px; border: 1px solid var(--stroke-strong); background: var(--glass-strong); color: var(--fg); font: inherit; font-size: 16px; }
  .login-card input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .login-err { color: var(--warn); font-size: 14px; font-weight: 600; }
  .login-card .btn { justify-content: center; margin-top: 6px; }
  .login-back { align-self: center; font-size: 14px; color: var(--soft); margin-top: 4px; }
  .login-back:hover { color: var(--fg); }
</style>
</head>
<body class="login">
<div class="ambient"></div>
<main class="login-wrap">
  <form class="glass login-card" method="post" action="/login">
    <div class="eyebrow">Admin</div>
    <h1>Sign <em>in</em></h1>
    <p class="login-sub">Enter the admin password to edit the portfolio.</p>
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required maxlength="256" autofocus aria-describedby="err">
    <p class="login-err" id="err" role="alert" hidden></p>
    <button class="btn primary" type="submit">Sign in</button>
    <a class="login-back" href="index.html">← Back to the site</a>
  </form>
</main>
<script>
/* the server redirects back here with ?e=1 after a wrong password */
(function () {
  var e = new URLSearchParams(location.search).get("e");
  if (!e) return;
  var p = document.getElementById("err");
  p.textContent = "That password is not correct. Try again.";
  p.hidden = false;
  history.replaceState(null, "", location.pathname);
})();
</script>
</body>
</html>
